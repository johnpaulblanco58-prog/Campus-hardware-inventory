<!-- reset.html-->

{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="logo-box">
                LAB
            </div>

            <h1>
                Reset Password
            </h1>

            <p>
                Submit a password reset request
            </p>

        </div>


        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label>
                    Registered Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button full-button"
            >
                Submit Request
            </button>

        </form>


        <div class="info-box">

            Your password reset request will be reviewed
            by the administrator.

        </div>


        <div class="auth-links">

            <a
                href="{{ url_for('login') }}"
            >
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
