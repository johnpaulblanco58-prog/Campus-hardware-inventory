{% extends "base.html" %}

{% block title %}
Login | Laboratory System
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="logo-box">
                LAB
            </div>

            <h1>
                Laboratory System
            </h1>

            <p>
                Engineering Laboratory Asset Management
            </p>

        </div>

        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                    >
                    <button 
                        type="button" 
                        class="toggle-password" 
                        id="togglePassword"
                        aria-label="Show password"
                        title="Show password"
                    >
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                        <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                            <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="primary-button full-button"
            >
                Sign In
            </button>

        </form>

        <div class="auth-links">

            <a
                href="{{ url_for('register') }}"
            >
                Create Account
            </a>

            <span>
                |
            </span>

            <a
                href="{{ url_for('verify') }}"
            >
                Verify Account
            </a>

            <span>
                |
            </span>

            <a
                href="{{ url_for('reset') }}"
            >
                Reset Password
            </a>

        </div>

    </div>

</div>

<script>
    function togglePasswordVisibility(inputId, button) {
        const passwordInput = document.getElementById(inputId);
        if (!passwordInput) return;

        const eyeIcon = button.querySelector(".eye-icon");
        const eyeOffIcon = button.querySelector(".eye-off-icon");
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";

        if (eyeIcon) eyeIcon.style.display = isHidden ? "none" : "block";
        if (eyeOffIcon) eyeOffIcon.style.display = isHidden ? "block" : "none";

        button.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
        button.setAttribute("title", isHidden ? "Hide password" : "Show password");
    }

    document.addEventListener("DOMContentLoaded", function () {
        const togglePassword = document.getElementById("togglePassword");
        if (togglePassword) {
            togglePassword.addEventListener("click", function () {
                togglePasswordVisibility("password", this);
            });
        }
    });
</script>

{% endblock %}
